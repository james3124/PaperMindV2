name: release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote edge pre-release to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REL_JSON=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/edge)
          COMMIT=$(echo "$REL_JSON" | jq -r '.target_commitish')
          BODY=$(echo "$REL_JSON" | jq -r '.body')
          VER=$(echo "$BODY" | grep -oE '1\.0\.[0-9]+' | head -1)
          if [ -z "$VER" ]; then
            echo "::error::edge release notes carry no version stamp; refusing to invent one"
            exit 1
          fi
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "::error::v$VER already exists; edge was already promoted"
            exit 1
          fi
          mkdir -p dist
          gh release download edge -p PaperMind.apk -D dist
          NOTES=$(echo "$BODY" | grep -v 'Rolling pre-release' | sed 's/^Version: .*//')
          gh release create "v$VER" dist/PaperMind.apk \
            --target "$COMMIT" \
            --title "PaperMind v$VER" \
            --notes "$NOTES" \
            --latest
          echo "Promoted edge -> v$VER (latest)"
