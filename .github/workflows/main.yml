name: main

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app)
        run: npx tsc --noEmit

      - name: Typecheck (editor-web)
        run: npm run typecheck:web

      - name: Lint
        run: npm run lint

      - name: Unit tests (app)
        run: npm test

      - name: Unit tests (editor-web)
        run: npm run test:web

      - name: Expo doctor
        run: npx expo-doctor
