name: main

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install editor-web dependencies
        run: npm ci --prefix editor-web

      - name: Generate Expo type env
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Verify editor bundle is fresh
        run: |
          npm run build:editor-web
          git diff --exit-code src/generated/editor-html.ts assets/editor-web/index.html \
            || { echo "::error::committed editor bundle is stale — run: npm run build:editor-web"; exit 1; }

      - name: Typecheck (app)
        run: npx tsc --noEmit

      - name: Typecheck (editor-web)
        run: npm run typecheck:web

      - name: Lint
        run: npm run lint

      - name: Unit tests (app)
        run: npm test

      - name: Unit tests (editor-web)
        run: npm run test:web

      - name: Expo doctor
        run: npx expo-doctor
        continue-on-error: true # CNG project with committed android/ triggers expected sync warning
