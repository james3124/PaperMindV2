name: build-apk

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Bump version code
        run: |
          python3 - <<EOF
          import json
          cfg = json.load(open('app.json'))
          cfg['expo'].setdefault('android', {})['versionCode'] = ${{ github.run_number }}
          cfg['expo']['version'] = "1.0.${{ github.run_number }}"
          json.dump(cfg, open('app.json', 'w'), indent=2)
          EOF

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/papermind-release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Patch build.gradle for release signing and ABI filters
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          # 1. Add ABI filters inside defaultConfig (after versionName)
          s = re.sub(
              r'(versionName\s+"[^"]+")',
              r'\1\n        ndk {\n            abiFilters "arm64-v8a", "armeabi-v7a"\n        }',
              s, count=1,
          )
          # 2. Add release signingConfig (after debug block)
          s = s.replace(
              "        }\n    }\n    buildTypes {",
              "        }\n        release {\n            if (System.getenv(\"ANDROID_KEYSTORE_BASE64\")) {\n                storeFile file('papermind-release.keystore')\n                storePassword System.getenv(\"ANDROID_KEYSTORE_PASSWORD\")\n                keyAlias System.getenv(\"ANDROID_KEY_ALIAS\")\n                keyPassword System.getenv(\"ANDROID_KEY_PASSWORD\")\n            }\n        }\n    }\n    buildTypes {",
              1,
          )
          # 3. Make release buildType use release signingConfig when env is present
          s = s.replace(
              "            signingConfig signingConfigs.debug\n            def enableShrinkResources",
              "            signingConfig System.getenv(\"ANDROID_KEYSTORE_BASE64\") ? signingConfigs.release : signingConfigs.debug\n            def enableShrinkResources",
              1,
          )
          open(p, 'w').write(s)
          print("patched build.gradle")
          PY

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/PaperMind.apk

      - name: Generate release notes
        run: |
          PREV=$(git rev-parse -q --verify refs/tags/edge || true)
          if [ -z "$PREV" ]; then RANGE="HEAD~10..HEAD"; else RANGE="$PREV..HEAD"; fi
          {
            echo "Version: 1.0.${{ github.run_number }}"
            echo
            echo "Rolling pre-release built from master. Not the official release."
            echo
            echo "### Added"
            git log $RANGE --no-merges --pretty=%s | grep -E '^feat' | sed -E 's/^feat[^:]*: /- /' || echo "- (none)"
            echo
            echo "### Fixed"
            git log $RANGE --no-merges --pretty=%s | grep -E '^fix' | sed -E 's/^fix[^:]*: /- /' || echo "- (none)"
            echo
            echo "### Improved"
            git log $RANGE --no-merges --pretty=%s | grep -E '^(perf|ci|chore|refactor|docs|style|test)' | sed -E 's/^[a-z]+[^:]*: /- /' || echo "- (none)"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish edge pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: PaperMind Edge (pre-release)
          body_path: RELEASE_NOTES.md
          files: dist/PaperMind.apk
          prerelease: true
          make_latest: "false"
          overwrite: true
